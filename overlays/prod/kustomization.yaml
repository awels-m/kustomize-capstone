apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: prod-

patchesStrategicMerge:
  - deployment-patch.yaml

configMapGenerator:
  - name: app-config
    behavior: replace
    literals:
      - WELCOME_MESSAGE=Hello from PROD
      - FEATURE_FLAG_X=false

secretGenerator:
  - name: app-secret
    behavior: replace
    literals:
      - API_TOKEN=prod-demo-token
