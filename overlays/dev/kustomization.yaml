apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Use base
resources:
  - ../../base

# Prefix all names (e.g., dev-web, dev-app-config, etc.)
namePrefix: dev-

# Apply the deployment patch
patchesStrategicMerge:
  - deployment-patch.yaml

# Override/extend generators for this environment (values differ from base)
configMapGenerator:
  - name: app-config
    behavior: replace
    literals:
      - WELCOME_MESSAGE=Hello from DEV — change 1
      - FEATURE_FLAG_X=true

secretGenerator:
  - name: app-secret
    behavior: replace
    literals:
      - API_TOKEN=dev-demo-token
