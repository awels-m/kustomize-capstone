apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: stg-

patchesStrategicMerge:
  - deployment-patch.yaml

configMapGenerator:
  - name: app-config
    behavior: replace
    literals:
      - WELCOME_MESSAGE=Hello from STAGING
      - FEATURE_FLAG_X=true

secretGenerator:
  - name: app-secret
    behavior: replace
    literals:
      - API_TOKEN=staging-demo-token
